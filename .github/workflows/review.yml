name: argus-review

# Argus reviews pull requests on its own repository. It runs when a PR is
# opened or leaves draft, and on demand for a given PR number. It does not
# run on every push (synchronize) so a busy branch neither burns quota nor
# stacks duplicate reviews.

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: argus-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR head itself, not the merge commit, so line numbers match the diff.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          # Full history: the git_history tool asks which commits touched a line.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Review
        run: >-
          uv run argus review
          --pr ${{ github.event.pull_request.number || inputs.pr }}
          --post --json argus-review.json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGUS_LOG_FORMAT: json
      - name: Keep the review record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-review
          path: argus-review.json
          if-no-files-found: ignore
