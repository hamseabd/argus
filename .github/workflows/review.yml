name: argus-review

# Argus reviews pull requests on its own repository. It runs when a PR is
# opened or leaves draft, and on demand for a given PR number. It does not
# run on every push (synchronize) so a busy branch neither burns quota nor
# stacks duplicate reviews.
#
# Any repository can reuse it: call this file as a reusable workflow at a
# pinned tag and pass the same three secrets (see the README). Argus is then
# checked out from its own repository at that same pinned commit.
#
# Trust model: Argus itself is installed and run from a trusted ref, this
# repository's default branch or the commit a calling repository pinned.
# The pull request head is checked out into a separate directory that is
# only read, never installed or executed, so a PR cannot run its own code
# next to the subscription token. Pull requests from forks are skipped on
# the pull_request event because GitHub gives them no secrets and a
# read-only token; a maintainer can still review one on demand.
#
# Identity: the review is posted with an installation token for the Argus
# GitHub App, minted just before the review step and revoked when the job
# ends, so it appears under Argus's own name. The workflow's own token is
# read-only.

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number
  workflow_call:
    inputs:
      pr:
        description: Pull request number to review when the calling event is not a pull_request
        required: false
        type: number
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude subscription token from `claude setup-token`
        required: true
      ARGUS_APP_ID:
        description: App ID of the Argus GitHub App, which must be installed on the calling repository
        required: true
      ARGUS_APP_PRIVATE_KEY:
        description: Private key of the Argus GitHub App
        required: true

permissions:
  contents: read

concurrency:
  group: argus-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # A review of a small PR takes about five minutes; a stuck one must not hold
    # the runner (and the quota window) for the six-hour default.
    timeout-minutes: 30
    steps:
      - name: Check out Argus (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # job.workflow_repository and job.workflow_sha describe this workflow file,
          # not the caller's. In this repository that would be the pull request's
          # own commit, so the default branch is used instead; called from another
          # repository it is the commit the caller pinned, which is what we want.
          repository: ${{ job.workflow_repository }}
          ref: ${{ github.repository != job.workflow_repository && job.workflow_sha || github.event.repository.default_branch }}
      - name: Check out the pull request head (reviewed, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          path: target
          # Full history: the git_history tool asks which commits touched a line.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Mint the Argus app token
        id: argus-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ARGUS_APP_ID }}
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
      - name: Review
        working-directory: target
        run: >-
          uv run --project "$GITHUB_WORKSPACE" argus review
          --pr "$PR_NUMBER" --post --json "$GITHUB_WORKSPACE/argus-review.json"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.argus-app.outputs.token }}
          ARGUS_LOG_FORMAT: json
      - name: Keep the review record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argus-review
          path: argus-review.json
          if-no-files-found: ignore
