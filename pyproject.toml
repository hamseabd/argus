[project]
name = "argus"
version = "0.1.0"
description = "Multi-agent code-review harness on the Claude Agent SDK: orchestrated specialist subagents, independently verified findings, inline GitHub reviews"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Hamse Abdi", email = "hmseabd@gmail.com" }]
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "httpx>=0.28",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "structlog>=25",
    "typer>=0.29.1",
]

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pyyaml>=6",
    "respx>=0.22",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.ruff]
target-version = "py312"
line-length = 100
# The eval corpus holds deliberately buggy code; lint must neither flag nor rewrite it,
# and a noqa comment would tip off the reviewer under test.
extend-exclude = ["evals/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
files = ["argus"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: runs the real Claude Agent SDK; opt in with `pytest -m live`",
]
