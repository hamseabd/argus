[project]
name = "argus"
version = "0.1.0"
description = "Multi-agent code-review harness on the Claude Agent SDK: orchestrated specialist subagents, independently verified findings, inline GitHub reviews"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Hamse Abdi", email = "hmseabd@gmail.com" }]
dependencies = [
    "claude-agent-sdk>=0.2.157",
    "httpx>=0.28",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25",
    "typer>=0.27",
]

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.4",
    "pyyaml>=6",
    "respx>=0.22",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: runs the real Claude Agent SDK; opt in with `pytest -m live`",
]
