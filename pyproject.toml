[project]
name = "argus"
version = "0.1.0"
description = "Code-review agent on the Claude Agent SDK: parallel specialist subagents, self-verified findings, inline GitHub reviews"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Hamse Abdi", email = "hmseabd@gmail.com" }]
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "typer>=0.27",
]

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: runs the real Claude Agent SDK; opt in with `pytest -m live`",
]
